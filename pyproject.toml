[project]
name = "scalepulse"
version = "0.1.0"
description = "ScalePulse edge gateway: rate limiting, telemetry ingestion, and resilience middleware."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "redis[hiredis]>=5.2",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "alembic>=1.15",
    "pytest>=8.3",
    "httpx2>=2.13",
    "locust>=2.32",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["."]
addopts = "-ra -q"
