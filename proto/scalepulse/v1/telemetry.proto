syntax = "proto3";

package scalepulse.telemetry.v1;

import "google/protobuf/timestamp.proto";

enum RequestOutcome {
  REQUEST_OUTCOME_UNSPECIFIED = 0;
  REQUEST_OUTCOME_ALLOWED = 1;
  REQUEST_OUTCOME_RATE_LIMITED = 2;
  REQUEST_OUTCOME_UPSTREAM_ERROR = 3;
}

message TelemetryEvent {
  bytes event_id = 1;
  bytes tenant_id = 2;
  bytes api_key_id = 3;
  google.protobuf.Timestamp occurred_at = 4;
  string route_template = 5;
  string method = 6;
  uint32 status_code = 7;
  uint64 latency_microseconds = 8;
  uint64 request_bytes = 9;
  uint64 response_bytes = 10;
  RequestOutcome outcome = 11;
  bytes trace_id = 12;
}
